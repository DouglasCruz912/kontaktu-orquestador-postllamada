[project]
name = "orquestador-postllamada"
version = "0.1.0"
description = "Clasifica eventos de fin de llamada y emite órdenes contra el CRM (reto Kontaktu, LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
